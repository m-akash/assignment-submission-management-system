# Full local stack: PostgreSQL + Mailpit + API + (optional) Web.
# `docker compose up` → seeded database, running API, (when built) frontend, and every
# notification email visible at http://localhost:8025 with no mail credentials anywhere.
services:
  postgres:
    image: postgres:17-alpine
    container_name: asm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assignment_system}
      POSTGRES_USER: ${POSTGRES_USER:-assignments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assignments}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assignments} -d ${POSTGRES_DB:-assignment_system}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catch-all SMTP server with a web inbox — MailHog's maintained successor, same ports.
  # Accepts every message and delivers none of them onward, which is exactly what a dev
  # stack wants: the notification path is exercised for real (SMTP handshake included)
  # without a real address ever receiving school mail.
  mailpit:
    image: axllent/mailpit:latest
    container_name: asm-mailpit
    ports:
      - "1025:1025" # SMTP, what the API talks to
      - "8025:8025" # Web inbox, what you open to read the mail
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: src/AssignmentSystem.Api/Dockerfile
    container_name: asm-api
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-assignment_system};Username=${POSTGRES_USER:-assignments};Password=${POSTGRES_PASSWORD:-assignments};Include Error Detail=true"
      Jwt__Key: "${Jwt__Key:-CHANGE_ME_GENERATE_WITH_openssl_rand_base64_48_AT_LEAST_32_CHARS}"
      Jwt__Issuer: "${Jwt__Issuer:-AssignmentSystem.Api}"
      Jwt__Audience: "${Jwt__Audience:-AssignmentSystem.Web}"
      Jwt__AccessTokenMinutes: "${Jwt__AccessTokenMinutes:-5}"
      Jwt__RefreshTokenDays: "${Jwt__RefreshTokenDays:-7}"
      FileStorage__Root: "/data/submissions"
      # How long the emailed "choose your password" link stays valid.
      Auth__PasswordSetupTokenHours: "${Auth__PasswordSetupTokenHours:-48}"
      # Defaults point at the Mailpit container, so mail is genuinely sent and readable at
      # http://localhost:8025 out of the box. Override the whole group in `.env` to use a
      # real provider — set Host, Port, UseSsl and FromAddress together, since these
      # defaults are Mailpit's (plaintext, 1025) rather than a provider's (STARTTLS, 587).
      Email__Host: "${Email__Host:-mailpit}"
      Email__Port: "${Email__Port:-1025}"
      Email__UseSsl: "${Email__UseSsl:-false}"
      Email__Username: "${Email__Username:-}"
      Email__Password: "${Email__Password:-}"
      Email__FromAddress: "${Email__FromAddress:-noreply@assignment-system.local}"
      Email__FromName: "${Email__FromName:-Assignment System}"
      Email__AppBaseUrl: "${Email__AppBaseUrl:-http://localhost:3000}"
      Database__AutoMigrate: "true"
      Database__SeedOnStartup: "true"
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "5080:8080"
    volumes:
      - submission-files:/data/submissions
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5080
    container_name: asm-web
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5080"
    ports:
      - "3000:3000"

volumes:
  pgdata:
  submission-files:
